<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: -apple-system, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .section-header { border-left: 4px solid #2563eb; padding-left: 10px; margin: 20px 0 10px 0; font-weight: bold; color: #1e40af; font-size: 0.8rem; letter-spacing: 0.05em; }
        /* Modal Animation */
        #form-modal { transition: opacity 0.3s ease, visibility 0.3s; }
        #form-modal.hidden { opacity: 0; visibility: hidden; display: none; }
    </style>
</head>
<body class="pb-32">

    <div class="bg-blue-600 text-white px-6 pt-5 pb-6 rounded-b-3xl shadow-lg mb-6 sticky top-0 z-10 text-center">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <button type="button" id="prev-month" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/20 text-xl" aria-label="Previous month">‹</button>
            <button type="button" id="month-label" class="font-bold tracking-wide" title="Back to this month"></button>
            <button type="button" id="next-month" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/20 text-xl" aria-label="Next month">›</button>
        </div>
        <h1 class="text-xs opacity-80 uppercase tracking-widest font-bold mt-3">Net This Month</h1>
        <p id="total-amount" class="text-4xl font-bold mt-1 text-white">HK$ 0.00</p>
        <div class="grid grid-cols-3 gap-2 mt-4 max-w-md mx-auto text-xs">
            <div class="bg-white/10 rounded-xl py-2"><div class="opacity-80">Income</div><div id="sum-income" class="font-bold text-sm">0.00</div></div>
            <div class="bg-white/10 rounded-xl py-2"><div class="opacity-80">Expenses</div><div id="sum-expense" class="font-bold text-sm">0.00</div></div>
            <div class="bg-white/10 rounded-xl py-2"><div class="opacity-80">Cards</div><div id="sum-card" class="font-bold text-sm">0.00</div></div>
        </div>
    </div>

    <div class="max-w-2xl mx-auto px-4">
        <div id="expense-sections">
            <div id="load-error" class="hidden mb-4 p-3 rounded-xl bg-red-50 text-red-600 text-sm"></div>
            <div id="breakdown-block" class="hidden">
                <div class="section-header">SPENDING BY CATEGORY</div>
                <div id="breakdown" class="glass-card p-4 rounded-xl shadow-sm space-y-3 mb-6"></div>
            </div>
            <div class="section-header">EXPENSES</div>
            <div id="list-Expense" class="space-y-2 mb-6 text-sm text-gray-400 italic">No expense records.</div>

            <div class="section-header flex justify-between items-center pr-1">
                <span>CREDIT CARDS</span>
                <span id="card-unpaid" class="text-red-500 normal-case tracking-normal"></span>
            </div>
            <div id="list-Credit Card" class="space-y-2 mb-6 text-sm text-gray-400 italic">No credit card records.</div>

            <div class="section-header">INCOME</div>
            <div id="list-Income" class="space-y-2 mb-6 text-sm text-gray-400 italic">No income records.</div>
        </div>
    </div>

    <div class="fixed bottom-8 left-0 right-0 flex justify-center z-50">
        <button onclick="toggleModal()" class="bg-blue-600 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center text-3xl font-bold active:scale-90 transition-transform">
            +
        </button>
    </div>

    <div id="form-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-4">
        <div class="glass-card w-full max-w-md p-6 rounded-t-3xl sm:rounded-2xl shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="text-xl font-bold text-gray-800">New Record</h2>
                <button onclick="toggleModal()" class="text-gray-400 text-2xl">&times;</button>
            </div>
            
            <form id="expense-form" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 tracking-wider">TYPE</label>
                        <select id="record-type" class="w-full p-3 rounded-xl ring-1 ring-gray-200 bg-white">
                            <option value="Expense">Expense</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Income">Income</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 tracking-wider">AMOUNT (HKD)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" inputmode="decimal" required placeholder="0.00" class="w-full p-3 rounded-xl ring-1 ring-gray-200">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 tracking-wider">CATEGORY</label>
                        <input type="text" id="category" placeholder="e.g. Food" class="w-full p-3 rounded-xl ring-1 ring-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 tracking-wider">NAME</label>
                        <input type="text" id="spender" placeholder="Who paid?" class="w-full p-3 rounded-xl ring-1 ring-gray-200">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 tracking-wider">DATE</label>
                    <input type="date" id="record-date" required class="w-full p-3 rounded-xl ring-1 ring-gray-200 bg-white">
                </div>
                <div id="status-group" class="hidden">
                    <label class="block text-xs font-semibold text-gray-500 mb-1 tracking-wider">PAYMENT STATUS</label>
                    <select id="status" class="w-full p-3 rounded-xl ring-1 ring-gray-200 bg-white">
                        <option value="未還款">未還款 (Unpaid)</option>
                        <option value="已還款">已還款 (Paid)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 tracking-wider">NOTES</label>
                    <input type="text" id="notes" placeholder="Optional" class="w-full p-3 rounded-xl ring-1 ring-gray-200">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-md mt-2">
                    Save Record
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://apwgdjzwhnwjdbonaway.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwd2dkanp3aG53amRib25hd2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MzY2MjcsImV4cCI6MjA5MTAxMjYyN30._ZBC_NKIaUNQgzE2A4U3uw7cLy2_O6eshif7LzcIfLg';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('expense-form');
        const modal = document.getElementById('form-modal');
        const totalDisplay = document.getElementById('total-amount');
        const submitBtn = document.getElementById('submit-btn');
        const loadError = document.getElementById('load-error');
        const TYPES = ['Expense', 'Credit Card', 'Income'];
        const UNPAID = '未還款';
        const PAID = '已還款';
        const typeSelect = document.getElementById('record-type');
        const statusGroup = document.getElementById('status-group');
        const categoryInput = document.getElementById('category');

        // Status only applies to credit card bills
        function syncTypeFields() {
            const isCard = typeSelect.value === 'Credit Card';
            statusGroup.classList.toggle('hidden', !isCard);
            categoryInput.placeholder = isCard ? 'Card name, e.g. MOX' : 'e.g. Food';
        }
        typeSelect.addEventListener('change', syncTypeFields);

        // Turn Supabase "missing column" errors into a clear setup hint
        function friendlyError(err) {
            const msg = (err && err.message) || String(err);
            if (/column/i.test(msg) && /record_date/i.test(msg)) {
                return msg + '\n\nThe database is missing the new "record_date" column. Run supabase/add_record_date.sql in the Supabase SQL editor.';
            }
            if (/column/i.test(msg) && /(status|notes)/i.test(msg)) {
                return msg + '\n\nThe database is missing the new "status"/"notes" columns. Run supabase/add_status_and_notes.sql in the Supabase SQL editor.';
            }
            return msg;
        }

        // All records loaded from the database, keyed by id (used by edit so we never put user text into inline JS)
        let allRecords = [];
        let recordsById = {};
        let saving = false;

        // ---------- dates & months (all in the phone's local time) ----------
        function pad2(n) { return String(n).padStart(2, '0'); }
        function localDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
        function todayStr() { return localDateStr(new Date()); }

        // The day a record belongs to: record_date, or the day it was entered for older rows
        function recordDate(item) {
            if (item.record_date) return String(item.record_date).slice(0, 10);
            if (item.created_at) return localDateStr(new Date(item.created_at));
            return '';
        }

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            if (!y || !m || !d) return '';
            return new Date(y, m - 1, d).toLocaleDateString();
        }

        function shiftMonth(monthKey, delta) {
            const [y, m] = monthKey.split('-').map(Number);
            const d = new Date(y, m - 1 + delta, 1);
            return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
        }

        function monthLabel(monthKey) {
            const [y, m] = monthKey.split('-').map(Number);
            return `${y}年${m}月`;
        }

        const currentMonth = () => todayStr().slice(0, 7);
        let selectedMonth = currentMonth();

        function setMonth(monthKey) {
            selectedMonth = monthKey;
            render();
        }
        document.getElementById('prev-month').addEventListener('click', () => setMonth(shiftMonth(selectedMonth, -1)));
        document.getElementById('next-month').addEventListener('click', () => setMonth(shiftMonth(selectedMonth, 1)));
        document.getElementById('month-label').addEventListener('click', () => setMonth(currentMonth()));

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function toAmount(value) {
            const n = parseFloat(value);
            return Number.isFinite(n) ? n : 0;
        }

        function resetForm() {
            form.reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-title').innerText = 'New Record';
            submitBtn.innerText = 'Save Record';
            document.getElementById('record-date').value = todayStr();
            syncTypeFields();
        }

        function openModal() {
            if (!document.getElementById('edit-id').value) document.getElementById('record-date').value = todayStr();
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            resetForm();
        }

        function toggleModal() {
            if (modal.classList.contains('hidden')) openModal();
            else closeModal();
        }

        // Close when tapping the dark backdrop or pressing Escape
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal(); });

        function showLoadError(message) {
            loadError.textContent = message;
            loadError.classList.toggle('hidden', !message);
        }

        async function fetchRecords() {
            try {
                const { data, error } = await supabaseClient.from('expenses').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                showLoadError('');
                allRecords = data || [];
                render();
            } catch (err) {
                console.error('Failed to load records', err);
                showLoadError('Could not load records: ' + (err.message || err) + '. Please try again later.');
            }
        }

        function money(n) {
            return n.toLocaleString('en-HK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function render() {
            recordsById = {};
            allRecords.forEach(r => { recordsById[r.id] = r; });

            // Unpaid card bills carry over between months, so count them across all months
            const unpaidTotal = allRecords
                .filter(r => r.type === 'Credit Card' && r.status !== PAID)
                .reduce((sum, r) => sum + toAmount(r.amount), 0);

            // Newest first: by record date, then by entry time
            const monthRecords = allRecords
                .filter(r => recordDate(r).slice(0, 7) === selectedMonth)
                .sort((a, b) => recordDate(b).localeCompare(recordDate(a)) ||
                                String(b.created_at || '').localeCompare(String(a.created_at || '')));

            const sums = { 'Expense': 0, 'Credit Card': 0, 'Income': 0 };
            const byCategory = {};

            TYPES.forEach(type => {
                const container = document.getElementById(`list-${type}`);
                container.innerHTML = '';
                const filtered = monthRecords.filter(r => r.type === type || (!TYPES.includes(r.type) && type === 'Expense'));

                if (filtered.length === 0) {
                    container.innerHTML = `<p class="italic text-gray-400">No ${type.toLowerCase()} records this month.</p>`;
                    return;
                }

                filtered.forEach(item => {
                    const amt = toAmount(item.amount);
                    sums[type] += amt;
                    if (type !== 'Income') {
                        const cat = (item.category || '').trim() || 'General';
                        byCategory[cat] = (byCategory[cat] || 0) + amt;
                    }

                    const isCard = type === 'Credit Card';
                    const isPaid = item.status === PAID;
                    const statusBadge = isCard ? `
                        <button type="button" data-action="toggle-status" data-id="${escapeHtml(item.id)}"
                            class="ml-2 align-middle text-[10px] font-bold px-2 py-0.5 rounded-full ${isPaid ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}"
                            title="Tap to mark as ${isPaid ? 'unpaid' : 'paid'}">${isPaid ? PAID : UNPAID}</button>` : '';
                    const notesLine = item.notes ? `<p class="text-xs text-gray-500 truncate">${escapeHtml(item.notes)}</p>` : '';

                    const div = document.createElement('div');
                    div.className = 'glass-card p-4 rounded-xl flex justify-between items-center shadow-sm mb-2';
                    div.innerHTML = `
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-gray-800 truncate">${escapeHtml(item.category || 'General')}${statusBadge}</p>
                            ${notesLine}
                            <p class="text-[10px] text-gray-400 uppercase tracking-tight">${escapeHtml(formatDate(recordDate(item)))} • ${escapeHtml(item.spender || 'Family')}</p>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <p class="font-bold ${type === 'Income' ? 'text-green-600' : 'text-gray-800'}">HK$ ${money(amt)}</p>
                            <div class="flex gap-1">
                                <button type="button" data-action="edit" data-id="${escapeHtml(item.id)}" class="p-2 text-blue-500" aria-label="Edit">✎</button>
                                <button type="button" data-action="delete" data-id="${escapeHtml(item.id)}" class="p-2 text-red-400" aria-label="Delete">✕</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });

            // Monthly summary in the header
            const net = sums['Income'] - sums['Expense'] - sums['Credit Card'];
            document.getElementById('month-label').textContent = monthLabel(selectedMonth);
            totalDisplay.innerText = `${net < 0 ? '-' : ''}HK$ ${money(Math.abs(net))}`;
            document.getElementById('sum-income').textContent = money(sums['Income']);
            document.getElementById('sum-expense').textContent = money(sums['Expense']);
            document.getElementById('sum-card').textContent = money(sums['Credit Card']);
            document.getElementById('card-unpaid').textContent = unpaidTotal > 0 ? `全部未還款 HK$ ${money(unpaidTotal)}` : '';

            renderBreakdown(byCategory);
        }

        // Spending (expenses + card bills) per category for the selected month
        function renderBreakdown(byCategory) {
            const block = document.getElementById('breakdown-block');
            const box = document.getElementById('breakdown');
            const entries = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
            const total = entries.reduce((sum, [, v]) => sum + v, 0);
            block.classList.toggle('hidden', total <= 0);
            if (total <= 0) { box.innerHTML = ''; return; }

            const max = entries[0][1];
            box.innerHTML = entries.map(([cat, value]) => `
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-semibold text-gray-700 truncate pr-2">${escapeHtml(cat)}</span>
                        <span class="text-gray-600 whitespace-nowrap">HK$ ${money(value)} <span class="text-gray-400 text-xs">${Math.round(value / total * 100)}%</span></span>
                    </div>
                    <div class="h-2 rounded-full bg-gray-100 overflow-hidden">
                        <div class="h-full rounded-full bg-blue-500" style="width:${Math.max(2, value / max * 100).toFixed(1)}%"></div>
                    </div>
                </div>
            `).join('');
        }

        // One listener for all edit / delete buttons
        document.getElementById('expense-sections').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const id = btn.dataset.id;
            if (btn.dataset.action === 'edit') editRecord(id);
            else if (btn.dataset.action === 'delete') deleteRecord(id);
            else if (btn.dataset.action === 'toggle-status') toggleStatus(id, btn);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (saving) return; // prevent double submit

            const id = document.getElementById('edit-id').value;
            const amount = parseFloat(document.getElementById('amount').value);
            if (!Number.isFinite(amount) || amount <= 0) {
                alert('Please enter an amount greater than 0.');
                return;
            }

            const recordDateValue = document.getElementById('record-date').value;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(recordDateValue)) {
                alert('Please choose a date.');
                return;
            }

            const payload = {
                record_date: recordDateValue,
                amount: Math.round(amount * 100) / 100,
                type: document.getElementById('record-type').value,
                category: document.getElementById('category').value.trim(),
                spender: document.getElementById('spender').value.trim()
            };
            payload.status = payload.type === 'Credit Card' ? document.getElementById('status').value : null;
            payload.notes = document.getElementById('notes').value.trim() || null;

            const originalText = submitBtn.innerText;
            saving = true;
            submitBtn.disabled = true;
            submitBtn.innerText = 'Saving...';

            try {
                const { error } = id
                    ? await supabaseClient.from('expenses').update(payload).eq('id', id)
                    : await supabaseClient.from('expenses').insert([payload]);
                if (error) throw error;
                closeModal();
                selectedMonth = recordDateValue.slice(0, 7); // show the month the record was saved to
                await fetchRecords();
            } catch (err) {
                console.error('Failed to save record', err);
                alert('Save failed: ' + friendlyError(err) + '\nYour input has been kept, please try again.');
                submitBtn.innerText = originalText;
            } finally {
                saving = false;
                submitBtn.disabled = false;
                if (submitBtn.innerText === 'Saving...') submitBtn.innerText = 'Save Record';
            }
        });

        async function deleteRecord(id) {
            if (!confirm('Delete this record?')) return;
            try {
                const { error } = await supabaseClient.from('expenses').delete().eq('id', id);
                if (error) throw error;
            } catch (err) {
                console.error('Failed to delete record', err);
                alert('Delete failed: ' + (err.message || err));
            }
            fetchRecords();
        }

        async function toggleStatus(id, btn) {
            const item = recordsById[id];
            if (!item) return;
            const next = item.status === PAID ? UNPAID : PAID;
            btn.disabled = true;
            try {
                const { error } = await supabaseClient.from('expenses').update({ status: next }).eq('id', id);
                if (error) throw error;
            } catch (err) {
                console.error('Failed to update status', err);
                alert('Update failed: ' + friendlyError(err));
            }
            fetchRecords();
        }

        function editRecord(id) {
            const item = recordsById[id];
            if (!item) return;
            resetForm();
            openModal();
            document.getElementById('modal-title').innerText = 'Edit Record';
            document.getElementById('edit-id').value = item.id;
            document.getElementById('record-type').value = TYPES.includes(item.type) ? item.type : 'Expense';
            document.getElementById('amount').value = toAmount(item.amount);
            document.getElementById('category').value = item.category || '';
            document.getElementById('spender').value = item.spender || '';
            document.getElementById('notes').value = item.notes || '';
            document.getElementById('record-date').value = recordDate(item) || todayStr();
            document.getElementById('status').value = item.status === PAID ? PAID : UNPAID;
            syncTypeFields();
            submitBtn.innerText = 'Update Record';
        }

        // Refresh when the user comes back to the app (e.g. another family member added a record)
        document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchRecords(); });

        render();
        fetchRecords();
    </script>
</body>
</html>
